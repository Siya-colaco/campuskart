<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CampusKart – Buy. Sell. Connect. On Campus.</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f8fd;--c:#fff;--ink:#0d1b3e;--mu:#59637d;--ln:#dfe5f3;--b:#2f5be0;--soft:#eaf0ff;--ok:#16803c;--okb:#dcfce7;--o:#f59e0b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0b1020;--c:#141b30;--ink:#eef2ff;--mu:#9aa6c4;--ln:#252e4a;--b:#6b8cff;--soft:#1a2548;--ok:#6ee7a0;--okb:#10321f}}
:root[data-theme=dark]{--bg:#0b1020;--c:#141b30;--ink:#eef2ff;--mu:#9aa6c4;--ln:#252e4a;--b:#6b8cff;--soft:#1a2548;--ok:#6ee7a0;--okb:#10321f}
*{box-sizing:border-box}html,body{margin:0}
body{background:#e9edf8;font-family:Inter,system-ui,-apple-system,sans-serif;color:var(--ink);line-height:1.4}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) body{background:#05070f}}
#app{max-width:430px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative;box-shadow:0 0 50px rgba(30,50,120,.15)}
.p{padding:18px 18px 28px}.c{text-align:center}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}
.lg{display:flex;align-items:center;gap:8px}.lg b{font-size:21px;letter-spacing:-.02em}.lg i{font-style:normal;color:var(--b)}.lg small{display:block;font-size:8px;color:var(--mu);font-weight:600}.lg span{font-size:30px}
.pill{display:inline-flex;gap:8px;align-items:center;border:1.5px solid var(--ln);background:var(--soft);color:var(--b);font-weight:600;font-size:14px;padding:9px 16px;border-radius:99px}
h1{font-size:30px;line-height:1.1;letter-spacing:-.03em;font-weight:800;margin:16px 0 10px}
.mu{color:var(--mu)}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.gc,.rc{min-width:0}.gc .im{height:auto;aspect-ratio:4/3}.g2 .gc h4{font-size:14.5px;line-height:1.25;white-space:normal;overflow:visible;text-overflow:clip;min-height:2.5em;margin-bottom:4px}
.gc,.rc,.row,.box{background:var(--c);border:1px solid var(--ln);border-radius:20px;padding:10px;box-shadow:0 8px 22px -16px rgba(20,40,120,.4);text-align:left}
.im{height:120px;border-radius:14px;background:linear-gradient(135deg,var(--g1,#cfdcff),var(--g2,#f1f5ff));display:grid;place-items:center;font-size:44px;position:relative}
.tg{position:absolute;top:8px;left:8px;background:#fff;color:#0d1b3e;font-size:11px;font-weight:600;padding:3px 9px;border-radius:8px}
.gc h4,.rc h4{margin:10px 2px 3px;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mt{font-size:12px;color:var(--mu);margin:0 2px}.ck{color:var(--ok)}
.pr{display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid var(--ln);margin:8px 2px 0;padding-top:8px}
.pr b{font-size:22px;color:var(--b)}.pr s,.pr em{color:var(--mu);font-size:12px;font-style:normal}.pr em{color:var(--ok)}
.bar{display:flex;gap:8px;align-items:center;justify-content:center;border:1.5px solid var(--ln);background:var(--soft);color:var(--b);font-weight:600;font-size:13px;padding:11px;border-radius:99px;margin:16px 0 12px}
.btn{width:100%;border:0;background:var(--b);color:#fff;font-weight:700;font-size:17px;padding:15px;border-radius:16px;box-shadow:0 10px 22px -10px var(--b)}
.btn.o{background:var(--c);color:var(--ink);border:1px solid var(--ln);box-shadow:none;font-weight:600;font-size:15px;margin-top:10px}
.lnk{color:var(--b);font-weight:600;background:none;border:0;padding:0}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:#e8edf8;border-radius:14px;padding:5px;margin:18px 0}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .tabs{background:#1a2240}}
.tabs button{border:0;background:none;padding:11px;border-radius:10px;font-weight:600;color:var(--mu)}.tabs .on{background:var(--c);color:var(--ink);box-shadow:0 2px 6px rgba(0,0,0,.08)}
.box{padding:20px}.box h2{margin:0 0 4px;font-size:25px;letter-spacing:-.02em}
label{display:flex;justify-content:space-between;font-weight:600;font-size:14px;margin:16px 0 7px}label small{color:var(--mu);font-weight:400}
.in{width:100%;padding:13px 14px;border:1.5px solid var(--ln);border-radius:14px;background:var(--c);outline:0}.in:focus{border-color:var(--b)}
.hint{font-size:12px;color:var(--mu);margin-top:6px}
.sep{display:flex;align-items:center;gap:10px;color:var(--mu);font-size:12px;font-weight:600;letter-spacing:.06em;margin:18px 0}.sep:before,.sep:after{content:"";flex:1;height:1px;background:var(--ln)}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.ib{border:0;background:none;font-size:22px;padding:4px 8px;color:var(--ink)}
.chips{display:flex;gap:8px;overflow-x:auto;margin:12px 0;padding-bottom:4px}.chips::-webkit-scrollbar{display:none}
.ch{white-space:nowrap;border:1.5px solid var(--ln);background:var(--c);padding:9px 16px;border-radius:99px;font-weight:600;font-size:14px}.ch.on{background:var(--b);color:#fff;border-color:var(--b)}
.cats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.cat{background:var(--c);border:1px solid var(--ln);border-radius:16px;padding:14px 4px;font-weight:600;font-size:14px;text-align:center}.cat i{display:grid;place-items:center;width:44px;height:44px;margin:0 auto 8px;background:var(--soft);border-radius:12px;font-style:normal;font-size:20px}
.sell{background:linear-gradient(135deg,#2f5be0,#1e44bd);color:#fff;border-radius:24px;padding:18px;display:flex;justify-content:space-between;align-items:center;margin:20px 0}
.sell b{font-size:20px}.sell small{display:block;opacity:.9}.sell button{background:#fff;color:#2f5be0;border:0;font-weight:700;padding:12px 18px;border-radius:14px}
h3{font-size:23px;margin:22px 0 2px;letter-spacing:-.02em}.sub{margin:0 0 12px;color:var(--mu);font-size:14px}.sh{display:flex;justify-content:space-between;align-items:baseline}
.sm{width:100%;border:1.5px solid var(--ln);background:var(--soft);color:var(--b);font-weight:600;padding:10px;border-radius:12px;margin-top:8px}
.rc .bk{position:absolute;top:8px;right:8px;width:34px;height:34px;border-radius:50%;border:0;background:#fff;font-size:15px}
.wide{display:flex;gap:12px;margin-top:12px}.wide .im{width:42%;height:auto;min-height:130px;flex:none}
.row{display:flex;gap:12px;margin-bottom:12px;padding:12px;cursor:pointer}.row .im{width:92px;height:92px;flex:none;font-size:34px}.row .tg{top:auto;bottom:6px;left:6px}.row>div:last-child{flex:1;min-width:0}
.row h4{margin:0;font-size:16px}.row .pp{color:var(--b);font-weight:800;font-size:19px}.row .ft{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--ln);margin-top:8px;padding-top:6px;font-size:12px}
.mini{background:var(--soft);color:var(--b);border:0;font-weight:600;padding:6px 14px;border-radius:10px}
.nav{position:sticky;bottom:0;display:grid;grid-template-columns:repeat(4,1fr);background:var(--bg);border-top:1px solid var(--ln);padding:8px 0 10px}
.nav button{border:0;background:none;color:var(--mu);font-size:12px;font-weight:600;display:grid;gap:2px;justify-items:center}.nav button.on{color:var(--b)}.nav span{font-size:20px}
.cond{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.cd{text-align:left;border:1.5px solid var(--ln);background:var(--c);border-radius:14px;padding:12px}.cd.on{border-color:var(--b);background:var(--soft)}.cd b{display:block;font-size:14px}.cd.on b{color:var(--b)}.cd small{color:var(--mu);font-size:12px}
.up{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.up div{aspect-ratio:1;border-radius:14px;border:1.5px dashed var(--ln);display:grid;place-items:center;font-size:12px;color:var(--mu);text-align:center}.up .cv{border:0;background:linear-gradient(135deg,#d6e0ff,#f1f5ff);font-size:40px;position:relative}
.ai{background:var(--soft);border:1px solid var(--ln);border-radius:18px;padding:14px;margin-top:14px}.ai .in2{background:var(--c);border-radius:12px;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;margin-top:8px}.ai b.g{color:var(--ok);font-size:18px}
.ap{border:0;background:var(--b);color:#fff;font-weight:600;padding:9px 14px;border-radius:10px}
.hc{background:var(--soft);border:1px solid var(--b);border-radius:16px;padding:12px;margin:10px 0;font-size:14px}.hc b{color:var(--b)}
.big{font-size:60px;font-weight:800;color:var(--b);letter-spacing:-.03em;text-align:center}
.rng{height:10px;border-radius:9px;background:var(--ln);position:relative;margin:14px 0 8px}.rng:after{content:"";position:absolute;left:25%;right:30%;top:0;bottom:0;background:var(--b);border-radius:9px}
.st{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.st div{background:var(--c);border:1px solid var(--ln);border-radius:14px;padding:10px 4px;text-align:center;font-size:12px;color:var(--mu)}.st b{display:block;color:var(--ink);font-size:14px}
.dimg{height:260px;border-radius:0 0 20px 20px;background:linear-gradient(135deg,#d9e3ff,#f3f6ff);display:grid;place-items:center;font-size:90px;position:relative}
.dimg .tg{position:absolute}.b2{position:absolute;left:12px;background:var(--b);color:#fff;font-size:12px;font-weight:600;padding:4px 10px;border-radius:99px}
.off{background:var(--okb);color:var(--ok);font-weight:700;font-size:13px;padding:4px 10px;border-radius:8px}
.t3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}.t3 div{border:1px solid var(--ln);background:var(--soft);color:var(--b);border-radius:14px;padding:10px 4px;text-align:center;font-size:12px;font-weight:600}
.sel{display:flex;gap:12px;align-items:center}.av{width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,#7aa2ff,#2f5be0);display:grid;place-items:center;color:#fff;font-size:22px;flex:none}
.vs{background:var(--okb);color:var(--ok);font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px}
.sp li{list-style:none;margin:8px 0;font-size:14px}.sp ul{padding:0;margin:8px 0}
.fb{position:sticky;bottom:0;display:flex;gap:10px;background:var(--bg);padding:12px 18px;border-top:1px solid var(--ln)}.fb .btn{font-size:15px;padding:13px}
.msg{max-width:78%;padding:11px 16px;border-radius:20px;margin:4px 0;font-size:15px}.me{background:var(--b);color:#fff;margin-left:auto;border-bottom-right-radius:6px}.th{background:var(--c);border:1px solid var(--ln);border-bottom-left-radius:6px}.ts{font-size:11px;color:var(--mu);margin-bottom:8px}.ts.r{text-align:right}
.ci{display:flex;gap:8px;align-items:center;margin-top:8px}.ci .in{border-radius:99px;flex:1}.ci button.s{width:44px;height:44px;border-radius:50%;border:0;background:var(--b);color:#fff;font-size:18px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom,0px));background:#0d1b3e;color:#fff;padding:11px 18px;border-radius:12px;font-size:14px;z-index:9;max-width:90%}
.sec{display:flex;gap:10px;background:var(--soft);border:1px solid var(--ln);border-radius:16px;padding:14px;font-size:13px;color:var(--b);margin-top:18px}
.dots{letter-spacing:3px}
</style></head>

 return '<div class="p" style="display:flex;flex-direction:column;min-height:100vh"><div class="top"><button class="ib" data-a="back">←</button><div class="sel" style="flex:1"><div class="av" style="width:40px;height:40px;font-size:16px">'+c.s[0]+'</div><div><b>'+c.s+'</b> <span class="vs">✔</span><div class="mu" style="font-size:12px">'+esc(c.t)+' · ₹'+c.p+'</div></div></div></div><div id="ml" style="flex:1">'+m+'<div class="hc"><b>🤝 Suggested Safe Handoff Zone</b><div style="font-size:14px">Central Library Turnstiles · Mon–Fri, 9 AM – 6 PM staffed by security.</div></div></div><div class="chips">'+['Tomorrow at Central Library 📚','What time works best?','Send ₹'+c.p+' (UPI)'].map(function(q){return '<button class="ch" style="background:var(--soft);color:var(--b)" data-a="qs" data-v="'+esc(q)+'">'+esc(q)+'</button>'}).join('')+'</div><div class="ci"><button class="ib">⊕</button><input class="in" id="ci" placeholder="Type a message… 📍"><button class="s" data-a="send">➤</button></div></div>'}
var SC={land:land,auth:auth,ver:ver,ex:explore,sell:sell,valu:valu,det:detail,chat:chat};
function tm(){var d=new Date();return d.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})}
function draw(keep){var y=window.scrollY;document.getElementById('app').innerHTML=SC[S.scr]();window.scrollTo(0,keep==2?y:0);
 if(S.scr=='ver'){var n=45;S.tm=setInterval(function(){n--;var e=document.getElementById('rs');if(!e||n<0){clearInterval(S.tm);return}e.textContent=n?'Resend code in 00:'+(n<10?'0':'')+n:'Resend code'},1000)}
 if(S.scr=='chat'){var i=document.getElementById('ci');if(i&&S.msgs.length)i.focus()}}

function startChat(it){S.chat={s:it.s,t:it.t,p:it.p};S.msgs=[{w:'me',t:'Hi, is this still available?',tm:'2:15 PM'},{w:'th',t:'Yes, it is available.',tm:'2:17 PM'},{w:'me',t:'Can I meet you on campus tomorrow?',tm:'2:18 PM'}];go('chat')}

document.addEventListener('click',function(e){var b=e.target.closest('[data-a]');if(!b)return;var a=b.dataset.a,v=b.dataset.v;
 if(a=='start'){go('auth')}else if(a=='tab'){S.tab=v;draw(2)}else if(a=='eye'){S.pwv=!S.pwv;draw(2)}else if(a=='toast'){toast(v)}

 else if(a=='nv'){S.nav=v;draw(1)}else if(a=='chip'){S.chip=v;draw(2)}else if(a=='cat'){S.q=v;draw(2)}
 else if(a=='save'){S.saved[v]=!S.saved[v];toast(S.saved[v]?'Saved 🔖':'Removed');draw(2)}
 else if(a=='open'){var i=ALL.filter(function(x){return x.id==v})[0];S.item={id:i.id,ph:i.ph,n:i.t,p:i.p,o:ORIG[i.id],d:i.desc||DESC[i.id]||'Great condition, available for campus meetup.',s:i.s,dp:i.d,l:i.l||i.d,tg:i.tg,cat:CAT[i.id],sp:SPEC[i.id],bd:i.id==2?'Lab Approved & Exam Ready':'Campus Verified Listing'};S.seller=i;go('det')}
 else if(a=='chat'){startChat(ALL.filter(function(x){return x.id==v})[0])}else if(a=='chatr'){startChat({s:S.item?S.item.s:'Rahul S.',t:S.item?S.item.n:ALL[1].t,p:S.item?S.item.p:600})}
 else if(a=='gochat'){go('chat')}else if(a=='offer'){toast('Offer sent to seller')}
 else if(a=='sell'){go('sell')}else if(a=='cond'){saveSell();S.sell.cond=+v;draw(2)}else if(a=='loc'){saveSell();S.sell.loc=+v;draw(2)}
 else if(a=='apply'){saveSell();S.sell.price=sg();draw(2);toast('Applied ₹'+sg())}else if(a=='valu'){saveSell();go('valu')}else if(a=='use'){S.sell.price=sg();toast('Price set to ₹'+sg());bk()}
 else if(a=='pub'){saveSell();var s=S.sell;S.item={ph:'det',n:s.name,p:+s.price||0,o:+s.orig||0,d:s.desc,s:'Alex Vance',dp:'Stanford Quad • Class of 2026',l:'Your campus',tg:'Just Listed',cat:s.cat,sp:SPEC[2],bd:'Campus Verified Listing'};S.pub=1;hist=['ex'];S.scr='det';toast('🎉 Listing published!');draw(1)}
 else if(a=='qs'){say(v)}else if(a=='send'){say(document.getElementById('ci').value)}else if(a=='out'){init()}
});
